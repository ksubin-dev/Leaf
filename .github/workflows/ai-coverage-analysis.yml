name: AI Coverage Analysis

on:
  workflow_dispatch:
    inputs:
      run_ai_analysis:
        description: "OpenAI API를 호출해 AI 분석 JSON을 생성합니다."
        type: boolean
        default: true
      model:
        description: "AI 분석에 사용할 OpenAI model id입니다."
        type: string
        default: gpt-5-mini

permissions:
  contents: read

concurrency:
  group: ai-coverage-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-coverage-report:
    name: AI 커버리지 분석 리포트
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create google-services.json for CI
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "leafy-ci",
              "storage_bucket": "leafy-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.subin.leafy"
                  }
                },
                "api_key": [
                  {
                    "current_key": "ci-placeholder-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: 커버리지 Markdown 요약 생성
        run: ./gradlew :jacocoCoverageSummary --build-cache --parallel --no-daemon

      - name: AI 분석 JSON 생성
        id: ai-analysis
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model }}
          RUN_AI_ANALYSIS: ${{ inputs.run_ai_analysis }}
        run: |
          if [ "${RUN_AI_ANALYSIS}" != "true" ]; then
            echo "AI analysis was disabled by workflow input." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY secret is not configured. Custom report will show the AI placeholder." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node scripts/generate-ai-coverage-analysis.mjs \
            --summary build/reports/jacoco/jacocoTestReport/coverage-summary.md \
            --prompt docs/ai-coverage-analysis-prompt.md \
            --out docs/ai-coverage-analysis-result.json \
            --model "${OPENAI_MODEL}"

          echo "AI coverage analysis JSON was generated with ${OPENAI_MODEL}." >> "$GITHUB_STEP_SUMMARY"

      - name: 커스텀 HTML 리포트 생성
        run: ./gradlew :generateCustomCoverageReport --build-cache --parallel --no-daemon

      - name: GitHub Actions Summary 작성
        run: |
          cat build/reports/jacoco/jacocoTestReport/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f docs/ai-coverage-analysis-result.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## AI 분석 결과" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- AI 분석 JSON artifact: \`ai-coverage-analysis-result\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 커스텀 HTML artifact: \`leafy-custom-coverage-report\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 커버리지 Markdown 요약 업로드
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-summary
          path: build/reports/jacoco/jacocoTestReport/coverage-summary.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: AI 분석 JSON 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ai-coverage-analysis-result
          path: docs/ai-coverage-analysis-result.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 1

      - name: JaCoCo HTML 리포트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: build/reports/jacoco/jacocoTestReport/html
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Leafy 커스텀 커버리지 리포트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: leafy-custom-coverage-report
          path: build/reports/leafy-test-report
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
