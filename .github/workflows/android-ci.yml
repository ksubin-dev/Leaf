name: Android CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.java"
      - "**/*.xml"
      - "**/*.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: 단위 테스트 및 커버리지 리포트
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create google-services.json for CI
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "leafy-ci",
              "storage_bucket": "leafy-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.subin.leafy"
                  }
                },
                "api_key": [
                  {
                    "current_key": "ci-placeholder-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: 단위 테스트 실행 및 커버리지 요약 생성
        run: |
          ./gradlew :generateCustomCoverageReport --build-cache --parallel --no-daemon
          cat build/reports/jacoco/jacocoTestReport/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 커버리지 Markdown 요약 업로드
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-summary
          path: build/reports/jacoco/jacocoTestReport/coverage-summary.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: JaCoCo HTML 리포트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: build/reports/jacoco/jacocoTestReport/html
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Leafy 커스텀 커버리지 리포트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: leafy-custom-coverage-report
          path: build/reports/leafy-test-report
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
